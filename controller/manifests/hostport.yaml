apiVersion: v1
kind: Namespace
metadata:
  name: pingress-system
---
# Resources managed by the controller in its own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pingress-controller-role
  namespace: pingress-system
rules:
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
---
# The controller reads TLS secrets referenced by Ingresses in every namespace.
# Restrict the namespaces of Ingresses (or this ClusterRole) if that is too broad for your cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pingress-controller-cluster-role
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pingress-controller-role-binding
  namespace: pingress-system
subjects:
  - kind: ServiceAccount
    namespace: pingress-system
    name: pingress-controller-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pingress-controller-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pingress-controller-cluster-role-binding
subjects:
  - kind: ServiceAccount
    namespace: pingress-system
    name: pingress-controller-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pingress-controller-cluster-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pingress-controller-user
  namespace: pingress-system
