[workspace]
members = ["controller", "pingress-config", "proxy"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
pingress-config = { path = "pingress-config" }
controller = { path = "controller" }
proxy-server = { path = "proxy" }

tokio = "1.52.3"
futures = "0.3.32"
async-trait = "0.1.89"

kube = "4.2.0"
k8s-openapi = "0.28.0"

pingora = "0.9.0"

clap = "4.6.1"

serde = "1.0.219"
serde_json = "1.0.150"

notify = "8.2.0"

tracing = "0.1.41"
tracing-subscriber = "0.3.20"

prometheus-client = "0.25.1"

axum = { version = "0.8.4", default-features = false }
http = "1.3.1"

[package]
name = "pingress-controller"
edition.workspace = true

[[bin]]
name = "controller"
path = "src/controller/main.rs"
required-features = ["controller"]

[[bin]]
name = "proxy"
path = "src/proxy/main.rs"
required-features = ["proxy"]

[dependencies]
controller = { workspace = true, optional = true }
proxy-server = { workspace = true, optional = true }

tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive"] }

tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }

kube = { workspace = true, optional = true }

[features]
controller = ["dep:controller", "dep:kube"]
proxy = ["dep:proxy-server"]
