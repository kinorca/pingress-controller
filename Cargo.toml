[workspace]
members = ["controller", "pingress-config", "proxy"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
pingress-config = { path = "pingress-config" }
controller = { path = "controller" }
proxy-server = { path = "proxy" }

tokio = "1.52.3"
futures = "0.3.32"
async-trait = "0.1.89"

kube = "3.1.0"
k8s-openapi = "0.27.1"

pingora = "0.8.0"

clap = "4.6.1"

serde = "1.0.219"
serde_json = "1.0.149"

notify = "8.2.0"
nix = "0.31.3"

regex = "1.12.3"

log = "0.4.28"
env_logger = "0.11.10"

[package]
name = "pingress-controller"
edition.workspace = true

[[bin]]
name = "controller"
path = "src/controller/main.rs"
required-features = ["controller"]

[[bin]]
name = "proxy"
path = "src/proxy/main.rs"
required-features = ["proxy"]

[dependencies]
controller = { workspace = true, optional = true }
proxy-server = { workspace = true, optional = true }

tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive"] }

log.workspace = true
env_logger.workspace = true

kube = { workspace = true, optional = true }

[features]
controller = ["dep:controller", "dep:kube"]
proxy = ["dep:proxy-server"]
